spring:
  application:
    name: gym-saas-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:gymsaas}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate auto-DDL
    # OSIV off: the tenant Hibernate filter is enabled per repository call by
    # TenantFilterAspect, so no request-wide persistence context is required.
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_this_is_a_dev_only_secret_replace_in_every_real_environment}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  notification:
    firebase-credentials-path: ${FCM_SERVICE_ACCOUNT_JSON_PATH:}
    enabled: ${NOTIFICATIONS_ENABLED:false}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v22.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    receipt-template: ${WHATSAPP_RECEIPT_TEMPLATE:fittrack_payment_receipt}
    expiry-template: ${WHATSAPP_EXPIRY_TEMPLATE:fittrack_expiry_3_day}
    reset-template: ${WHATSAPP_RESET_TEMPLATE:fittrack_password_reset}
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:91}
    expiry-reminder-cron: ${WHATSAPP_EXPIRY_REMINDER_CRON:0 0 9 * * *}
  platform-admin:
    email: ${PLATFORM_ADMIN_EMAIL:}
    password: ${PLATFORM_ADMIN_PASSWORD:}
    name: ${PLATFORM_ADMIN_NAME:Super Admin}
  auth:
    # Lifetime of a "forgot password" WhatsApp one-time password, in minutes.
    otp-ttl-minutes: ${AUTH_OTP_TTL_MINUTES:10}
  billing:
    monthly-fee: ${PLATFORM_MONTHLY_FEE:2500}

logging:
  level:
    com.gymsaas.platform: INFO
