databases:
  - name: fittrack-db
    databaseName: gymsaas
    user: gymsaas
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: fittrack-api
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: fittrack-db
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: fittrack-db
          property: port
      - key: SPRING_DATASOURCE_DB
        fromDatabase:
          name: fittrack-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: fittrack-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: fittrack-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: PLATFORM_ADMIN_NAME
        value: FitTrack Super Admin
      - key: NOTIFICATIONS_ENABLED
        value: "false"
      - key: WHATSAPP_ENABLED
        value: "false"